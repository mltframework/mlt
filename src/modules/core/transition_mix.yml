schema_version: 7.2
type: transition
identifier: mix
title: Mix
version: 4
copyright: Meltytech, LLC
creator: Dan Dennedy
license: LGPLv2.1
language: en
tags:
  - Audio
description: Mix two audio tracks.
bugs:
  - Samples from the longer of the two frames are discarded.
audio_formats:
  - f32le
parameters:
  - identifier: start
    title: Start
    argument: yes
    type: float
    mutable: yes
    description: >
      The mix level to apply to the second frame. -1 causes an automatic
      linear crossfade from 0 to 1. -2 causes an automatic constant-power
      (equal-power) crossfade from 0 to 1.

  - identifier: end
    title: End
    type: float
    mutable: yes
    description: >
      The ending value of the mix level. Mix level will be interpolated from
      start to end over the in-out range.

  - identifier: reverse
    title: Reverse
    type: boolean
    mutable: yes
    description: >
      Set to 1 to reverse the direction of the mix.
    default: 0
    widget: checkbox

  - identifier: combine
    title: Use an alternative mixing algorithm
    description: >
      Mix using a low pass filter to prevent affecting audio levels. However,
      this may introduce slight artifacts.
      This is incompatible with start < 0.
    type: boolean
    default: 0
    mutable: yes

  - identifier: sum
    title: Mix by simply adding samples
    description: >
      The default mixing algorithm halves the sample values before adding them
      to absolutely prevent clipping. However, that affects levels. This
      algorithm simply adds samples and may clip. In many real world scenarios,
      the signals being mixed typically have headroom in their level and are
      rarely correlated and thus often will not clip. Also, one can reduce the
      gain and add a limiter on the mixed output prior to integer quantization
      to prevent clipping.
      This mode is incompatible with start < 0.
    type: boolean
    default: 0
    mutable: yes

  - identifier: duck_threshold
    title: Duck Threshold
    type: float
    default: 0
    mutable: yes
    unit: dB
    widget: slider
    description: >
      Enables ducking when non-zero. If the RMS level of frame A exceeds this
      dBFS threshold, frame B is attenuated before mixing. When this is non-
      zero, the sum and combine mix modes are ignored.

  - identifier: duck_attenuation
    title: Duck Attenuation
    type: float
    default: -12
    mutable: yes
    unit: dB
    widget: slider
    description: >
      The minimum attenuation, in dBFS, applied to frame B while ducking.

  - identifier: duck_level
    title: Duck Level
    type: float
    default: 0
    readonly: yes
    unit: dB
    widget: spinner
    description: >
      Reports the current gain reduction, in dB, being applied to frame B.

  - identifier: duck_fade_in
    title: Duck Fade In
    type: float
    default: 1500
    minimum: 0
    maximum: 5000
    mutable: yes
    unit: ms
    widget: spinner
    description: >
      The fade-in time, in milliseconds, used when restoring frame B.

  - identifier: duck_fade_out
    title: Duck Fade Out
    type: float
    default: 250
    minimum: 0
    maximum: 5000
    mutable: yes
    unit: ms
    widget: spinner
    description: >
      The fade-out time, in milliseconds, used when reducing frame B.
