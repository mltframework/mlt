schema_version: 7.2
type: filter
identifier: placebo.color_transform
title: GPU Color Transfer
version: 1
copyright: Meltytech, LLC
license: LGPLv2.1
language: en
tags:
  - Video
  - Hidden
description: >
  Convert the transfer characteristic of a Vulkan texture or a placebo texture.
  color_transform factories this filter only after another placebo service
  has published the GPU context, and runs it before its CPU converter.
  This filter does not publish that context.
  It is usually the first filter after avformat, so the picture is still the
  decoded mlt_image_vulkan texture. A placebo texture is handled the same way
  when one already exists.

  The filter runs when the request is mlt_image_private, mlt_image_vulkan, or
  when force_trc is set. Any other image is left for color_transform. When it
  does convert, it asks avformat for an mlt_image_vulkan texture.

  When consumer.mlt_color_trc is set, this filter converts to that transfer.
  Linear light is kept in a half-float texture. color_transform copies
  force_trc onto this filter so the image is encoded back to color_trc
  before it is downloaded. An rgba64 request is encoded to 16-bit unorm.
  Any other pixel request is rgba8.
parameters:
  - identifier: force_trc
    title: Force TRC
    type: string
    description: >
      Convert to this transfer instead of consumer.mlt_color_trc.
      The consumer sets this to color_trc when it delinearizes.
    required: no
    readonly: no
    mutable: no
    default: unset
