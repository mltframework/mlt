schema_version: 7.2
type: filter
identifier: placebo.shader
title: GPU Shader (libplacebo)
version: 2
copyright: D-Ogi and Meltytech, LLC
creator: D-Ogi
license: LGPLv2.1
language: en
tags:
  - Video
description: >
  Load and apply a custom mpv/libplacebo .hook shader file for GPU-accelerated
  video processing. Supports Anime4K, FSRCNNX, film grain, and other
  mpv-compatible user shaders. The shader file is hot-reloaded when modified.
  A placebo texture is the usual input. An mlt_image_vulkan texture (a VkImage
  on the shared device) is mapped, shaded, and kept in VRAM. A caller that
  asked for mlt_image_vulkan receives a Vulkan texture. Any other caller
  receives a placebo texture.
  Place this filter ahead of placebo.render. The download to RAM happens in
  that render filter when the caller asks for a normal image format.
  The compiled shader cache is stored in a platform-specific location and can
  be overridden by setting the MLT_PLACEBO_CACHE_PATH environment variable to
  an absolute path for the cache file.
  Shader parameters declared with //!PARAM and //!TYPE DYNAMIC float (or int)
  can be set using animated MLT properties named param.<name>.
  Names are case-sensitive; omitted properties retain the shader defaults.
  Installed shader YAML files are discovered recursively in
  MLT_DATA/placebo/shaders and registered as placebo.<basename> filters.
  Each YAML file must have a sibling .hook file with the same basename.

image_formats:
  - rgba
  - rgba64

parameters:
  - identifier: resource
    title: Shader File
    type: string
    description: >
      Absolute path to a .hook or .glsl shader file (mpv user shader format).
      The file is monitored for changes and automatically reloaded.
    argument: yes
    default: ""
    mutable: yes
    readonly: no
    widget: fileopen

  - identifier: shader_text
    title: Shader Text
    type: string
    description: >
      Inline shader source code as an alternative to resource.
      If both are set, resource takes priority.
    default: ""
    mutable: yes
    readonly: no
