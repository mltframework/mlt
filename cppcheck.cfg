<?xml version="1.0"?>
<def format="2">
  <define name="VERSION" value="&quot;cppcheck&quot;"/>
  <define name="__int64" value="long long"/>
  <!-- libplacebo turns these into &(struct ...){ .field = ... }. Without the
       headers, cppcheck parses the call as a function and rejects the
       designated initializer. A non-null stand-in keeps the file checkable. -->
  <define name="pl_cache_params(...)" value="((void*)1)"/>
  <define name="pl_d3d11_params(...)" value="((void*)1)"/>
  <define name="pl_dispatch_params(...)" value="((void*)1)"/>
  <define name="pl_log_params(...)" value="((void*)1)"/>
  <define name="pl_opengl_params(...)" value="((void*)1)"/>
  <define name="pl_tex_params(...)" value="((void*)1)"/>
  <define name="pl_tex_transfer_params(...)" value="((void*)1)"/>
  <define name="pl_vk_inst_params(...)" value="((void*)1)"/>
  <define name="pl_vulkan_hold_params(...)" value="((void*)1)"/>
  <define name="pl_vulkan_params(...)" value="((void*)1)"/>
  <define name="pl_vulkan_release_params(...)" value="((void*)1)"/>
  <define name="pl_vulkan_sem_params(...)" value="((void*)1)"/>
  <define name="pl_vulkan_swapchain_params(...)" value="((void*)1)"/>
  <define name="pl_vulkan_wrap_params(...)" value="((void*)1)"/>
</def>
